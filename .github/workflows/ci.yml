name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticket_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ticket_qr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # CI=true (set automatically by GitHub) makes the integration tests
      # fail if the database is unreachable instead of silently skipping.
      DATABASE_URL: postgresql://ticket_app:ci_password@localhost:5432/ticket_qr_ci
      JWT_SECRET: ci-only-secret-not-for-production-use-1234567890
      TICKET_TOKEN_SECRET: ci-only-ticket-secret-not-for-production-0987654321
      CLIENT_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Workspaces: one lockfile at the repo root covers backend + frontend.
      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint --workspace backend

      - name: Run migrations
        run: npm run migrate --workspace backend

      - name: Run backend tests
        run: npm run test:coverage --workspace backend

      - name: Audit backend dependencies
        run: npm audit --workspace backend --audit-level=high || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint --workspace frontend

      - name: Run frontend tests
        run: npm run test --workspace frontend

      - name: Build frontend
        run: npm run build --workspace frontend
        env:
          VITE_API_URL: http://localhost:4000/api

      - name: Audit frontend dependencies
        run: npm audit --workspace frontend --audit-level=high || true
